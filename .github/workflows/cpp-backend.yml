name: C++ Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'pyracms-cpp-port/backend/**'
      - '.github/workflows/cpp-backend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'pyracms-cpp-port/backend/**'
      - '.github/workflows/cpp-backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the real suite the way the Dockerfile "tests" stage does: Conan
  # dependencies, gcov-instrumented build, a PostgreSQL service container and
  # the 80% line-coverage gate in backend/run-tests.sh. Native per-arch runners
  # (no QEMU: the Conan build is too slow under emulation).
  build-and-test:
    name: build-and-test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pyracms
          POSTGRES_PASSWORD: pyracms
          POSTGRES_DB: pyracms
        options: >-
          --health-cmd "pg_isready -U pyracms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build test image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: pyracms-cpp-port/backend
        target: tests
        load: true
        push: false
        tags: pyracms-backend-tests:ci
        cache-from: type=gha,scope=backend-tests-${{ matrix.runner }}
        cache-to: type=gha,mode=max,scope=backend-tests-${{ matrix.runner }}

    - name: Run tests and coverage gate
      run: |
        docker run --rm           --network "${{ job.services.postgres.network }}"           -e DB_HOST=postgres -e DB_USER=pyracms -e DB_PASSWORD=pyracms           pyracms-backend-tests:ci

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check formatting
      working-directory: pyracms-cpp-port/backend
      run: |
        find src include -name '*.cpp' -o -name '*.h' | xargs clang-format -n -Werror || true
