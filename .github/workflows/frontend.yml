name: Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'pyracms-cpp-port/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'pyracms-cpp-port/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pyracms-cpp-port/frontend/package-lock.json

    - name: Install dependencies
      working-directory: pyracms-cpp-port/frontend
      run: npm ci

    # One Prettier config (.prettierrc, 80 columns): drift fails here
    # instead of showing up as thousands of lint warnings.
    - name: Check formatting
      working-directory: pyracms-cpp-port/frontend
      run: npm run format:check

    # --max-warnings 0: warnings are fixed, not tolerated.
    - name: Run linter
      working-directory: pyracms-cpp-port/frontend
      run: npm run lint

    - name: Run type checking
      working-directory: pyracms-cpp-port/frontend
      run: npm run type-check

    # jest.config.js enforces the 80% coverage threshold.
    - name: Run tests with coverage
      working-directory: pyracms-cpp-port/frontend
      run: npx jest --ci --coverage

    - name: Upload coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-coverage
        path: pyracms-cpp-port/frontend/coverage
        if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: pyracms-cpp-port/frontend/package-lock.json

    - name: Install dependencies
      working-directory: pyracms-cpp-port/frontend
      run: npm ci

    - name: Build application
      working-directory: pyracms-cpp-port/frontend
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-build
        path: pyracms-cpp-port/frontend/.next
