name: Code runner images (GHCR)

# Sandbox images the backend starts with `docker run` to execute code
# snippets. Published as ghcr.io/<owner>/pyracms-runner-<lang> for
# linux/amd64 and linux/arm64 so they can be pulled on any Docker host
# (e.g. a Proxmox VPS): docker pull ghcr.io/johndoe6345789/pyracms-runner-go
# Pull requests build only.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'pyracms-cpp-port/docker/**'
      - '.github/workflows/runner-images.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'pyracms-cpp-port/docker/**'
      - '.github/workflows/runner-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lang: [ python, node, go, cpp, rust, java, ruby ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase owner)
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/pyracms-runner-${{ matrix.lang }}" \
            >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: pyracms-cpp-port/docker/${{ matrix.lang }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner-${{ matrix.lang }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.lang }}
