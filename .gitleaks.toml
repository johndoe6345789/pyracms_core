# Extend the default rules; only allow the C++ unit tests, which set a
# throwaway JWT_SECRET to exercise the "weak secret" checks.
[extend]
useDefault = true

[allowlist]
description = "fake secrets used by unit tests"
paths = [
  '''pyracms-cpp-port/backend/tests/.*''',
  # curl --user "${SMTP_USER}:${SMTP_PASS}": env var references, no secret.
  '''pyracms-cpp-port/scripts/test-mail\.sh''',
]
