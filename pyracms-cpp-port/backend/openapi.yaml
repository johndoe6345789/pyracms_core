openapi: 3.0.3
info:
  title: PyraCMS API
  description: Multi-tenant CMS with articles, forums, galleries, code snippets, and social features.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Article:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        displayName: { type: string }
        isPrivate: { type: boolean }
        userId: { type: integer }
        rendererName: { type: string }
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled, published, unpublished] }
        publishedAt: { type: string, format: date-time, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        content: { type: string }

    SearchResult:
      type: object
      properties:
        query: { type: string }
        totalCount: { type: integer }
        facets:
          type: object
          additionalProperties: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              id: { type: integer }
              title: { type: string }
              snippet: { type: string }
              url: { type: string }
              rank: { type: number }
              postId: { type: integer, description: forum_post hits only }
              threadId: { type: integer, description: forum_post hits only }

    AutocompleteItem:
      type: object
      properties:
        text: { type: string }
        type: { type: string }
        url: { type: string }

    UserFollow:
      type: object
      properties:
        userId: { type: integer }
        username: { type: string }
        avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }

    Achievement:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        icon: { type: string }
        earned: { type: boolean }
        earnedAt: { type: string, format: date-time, nullable: true }

    Reputation:
      type: object
      properties:
        total: { type: integer }
        postCount: { type: integer }
        upvoteCount: { type: integer }
        achievementCount: { type: integer }

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT token
        '401':
          description: Invalid credentials

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user

  /api/auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Get current user info

  /api/auth/oauth/{provider}/url:
    get:
      tags: [Auth, OAuth]
      summary: Get OAuth authorization URL
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [github, google, discord] }

  /api/auth/oauth/{provider}/callback:
    post:
      tags: [Auth, OAuth]
      summary: Exchange OAuth code for JWT
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }

  /api/articles:
    get:
      tags: [Articles]
      summary: List articles
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Array of articles
    post:
      tags: [Articles]
      security: [{ bearerAuth: [] }]
      summary: Create an article

  /api/articles/{name}:
    get:
      tags: [Articles]
      summary: Get article by name
    put:
      tags: [Articles]
      security: [{ bearerAuth: [] }]
      summary: Update article content
    delete:
      tags: [Articles]
      security: [{ bearerAuth: [] }]
      summary: Delete article

  /api/articles/{name}/publish:
    post:
      tags: [Articles, Publishing]
      security: [{ bearerAuth: [] }]
      summary: Publish an article

  /api/articles/{name}/schedule:
    post:
      tags: [Articles, Publishing]
      security: [{ bearerAuth: [] }]
      summary: Schedule article for future publishing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, scheduled_at]
              properties:
                tenant_id: { type: integer }
                scheduled_at: { type: string, format: date-time }

  /api/articles/{name}/unpublish:
    post:
      tags: [Articles, Publishing]
      security: [{ bearerAuth: [] }]
      summary: Unpublish an article

  /api/search:
    get:
      tags: [Search]
      summary: Full-text search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer }
        - name: type
          in: query
          schema: { type: string, enum: [all, article, forum_post, post, snippet, gamedep] }
      responses:
        '200':
          description: Search results with facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

  /api/search/autocomplete:
    get:
      tags: [Search]
      summary: Prefix-based autocomplete
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutocompleteItem' }

  /api/sitemap.xml:
    get:
      tags: [SEO]
      summary: XML sitemap
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: XML sitemap
          content:
            text/xml: {}

  /api/rss.xml:
    get:
      tags: [SEO]
      summary: RSS 2.0 feed

  /api/atom.xml:
    get:
      tags: [SEO]
      summary: Atom feed

  /api/articles/{name}/jsonld:
    get:
      tags: [SEO]
      summary: Schema.org JSON-LD for article

  /api/articles/{name}/opengraph:
    get:
      tags: [SEO]
      summary: Open Graph metadata for article

  /api/users/{id}/follow:
    post:
      tags: [Social]
      security: [{ bearerAuth: [] }]
      summary: Follow a user
    delete:
      tags: [Social]
      security: [{ bearerAuth: [] }]
      summary: Unfollow a user

  /api/users/{id}/followers:
    get:
      tags: [Social]
      summary: Get user's followers

  /api/users/{id}/following:
    get:
      tags: [Social]
      summary: Get users being followed

  /api/users/{id}/activity:
    get:
      tags: [Social]
      summary: User activity feed

  /api/users/{id}/achievements:
    get:
      tags: [Social]
      summary: User achievements

  /api/users/{id}/reputation:
    get:
      tags: [Social]
      summary: Calculate user reputation

  /api/forum/posts/{id}/reactions:
    put:
      tags: [Forum]
      summary: Toggle the caller's emoji reaction on a post
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, enum: [thumbs_up, heart, laugh, wow, sad, party] }
      responses:
        '200': { description: "{success, reactions:[{emoji,count,mine}]}" }
        '400': { description: Unknown emoji }
        '404': { description: Post not found on the caller's site }

  /api/forum/posts/{id}/reactions/{emoji}:
    delete:
      tags: [Forum]
      summary: Remove the caller's reaction
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "{success, reactions}" }
        '404': { description: Post not found on the caller's site }

  /api/forum/threads/{id}/move:
    put:
      tags: [Forum]
      summary: Move a thread to another forum of the same site
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forumId]
              properties:
                forumId: { type: integer }
      responses:
        '200': { description: "{success, id, forumId}" }
        '404': { description: Not a moderator/owner, or thread/forum not on the same site }

  /api/forum/users/{id}/stats:
    get:
      tags: [Forum]
      summary: Public forum statistics of one member on one site
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{postCount, threadCount, joinedAt, reputation}" }
        '404': { description: No such member on that site }

  /api/activity:
    get:
      tags: [Activity]
      summary: Recent public activity of a site
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: "[{id, type (article|thread|post|comment|user), actor, title, link, createdAt}]" }

  /api/analytics/summary:
    get:
      tags: [Analytics]
      summary: Views over 7/30 days and top pages (site admin or owner)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: "{views7d, views30d, topPages:[{path, views}]}" }

  /api/audit:
    get:
      tags: [Audit]
      summary: Admin action log of a site (site admin or owner)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: query, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: "[{id, action, target, actor, actorId, createdAt}]" }

  /api/gamedep/{type}:
    get:
      tags: [GameDep]
      summary: Public games or dependencies of a site (no sign-in needed)
      description: >
        Public = not private and has a published revision. Private pages and
        drafts are only returned to their owner, site owner and admins.
        `type` is game, dep or catalog (the launcher catalog).
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [game, dep, catalog] } }
        - { name: tenant_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: "[{id, name, displayName, isPrivate, visibility (public|private), revisions:[{version, published, url, sha256, size, binaries:[{os, arch, uuid, url, sha256, size}]}], dependencies:[{kind (pip|pyracms), name, version}], screenshots:[{uuid, url, thumbnail}]}]" }
    post:
      tags: [GameDep]
      summary: Create a game or dependency page
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                displayName: { type: string }
                description: { type: string }
                isPrivate: { type: boolean, description: "true hides the page from everyone but managers (default false)" }
                visibility: { type: string, enum: [public, private] }
      responses:
        '201': { description: "{id}" }
        '409': { description: Name already used on this site }

  /api/gamedep/{type}/{name}:
    get:
      tags: [GameDep]
      summary: One public game or dependency with revisions, binaries and dependencies (no sign-in needed)
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [game, dep] } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: Page JSON (see the list) }
        '404': { description: Missing, private or without a published revision (unless the caller manages it) }
    put:
      tags: [GameDep]
      summary: Update display name, description or visibility (owner or admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                description: { type: string }
                isPrivate: { type: boolean }
                visibility: { type: string, enum: [public, private] }
      responses:
        '200': { description: Updated }
        '403': { description: Not the owner }

  /api/files/{uuid}:
    get:
      tags: [Files]
      summary: Download a file (anonymous for public game/dep files)
      description: >
        Files of a game/dep page (binary, source archive, screenshot) are
        served to anyone while a referencing page is public and published;
        otherwise only to its owner/site admin (404 for everyone else, so
        private uuids cannot be probed). Supports a single byte Range
        (resume), ETag/If-None-Match and If-Range. Rate limited per IP.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, schema: { type: string, example: "bytes=1024-" } }
        - { name: If-None-Match, in: header, schema: { type: string } }
        - { name: If-Range, in: header, schema: { type: string } }
      responses:
        '200': { description: "Bytes; headers Accept-Ranges, ETag, Content-Length" }
        '206': { description: "Partial bytes; Content-Range: bytes a-b/total" }
        '304': { description: Not modified }
        '404': { description: Unknown, or private/draft game file }
        '416': { description: "Range starts past the end; Content-Range: bytes */total" }
        '429': { description: Too many requests }

  /api/files/{uuid}/thumbnail:
    get:
      tags: [Files]
      summary: Thumbnail (or the original) with the same access rules as the download
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Image bytes }
        '404': { description: Unknown, or private/draft game file }

  /api/docs:
    get:
      tags: [Documentation]
      summary: Swagger UI
