# docker-compose.ghcr.yml runs the prebuilt GHCR images (no build).
# Usage: PYRACMS_VERSION=1.2.3 docker compose -f docker-compose.ghcr.yml up -d
# (defaults to :latest; pin a version or digest for anything long-lived).
#
# Same posture as docker-compose.yml: loopback-only ports, env-driven
# credentials with dev fallbacks, demo seeding OFF unless SEED_DEV=1.
# For a real deployment layer the production override and provide secrets
# (see ../SECURITY.md):
#   docker compose -f docker-compose.ghcr.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d

services:
  postgres:
    image: postgres:15-alpine@sha256:a46e076249ce434e41203b8c1dadfaa025b9726331d72390df038385d6dc29cd
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyracms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyracms}
      POSTGRES_DB: ${POSTGRES_DB:-pyracms}
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only: never expose the database on the LAN/internet.
      - "127.0.0.1:5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pyracms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6399:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0@sha256:fcf6b29cb00f1db56921e6cb47b506e6a207fcaeae777765dfa733dc007513a6
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      # DEV ONLY: the backend speaks plain HTTP without credentials, so xpack
      # security is off. Safe only because the port is bound to loopback (dev)
      # or absent + on an internal network (docker-compose.prod.yml).
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9299:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/johndoe6345789/pyracms-backend:${PYRACMS_VERSION:-latest}
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      # Pre-pull once: for l in python node go cpp rust java ruby; do
      #   docker pull ghcr.io/johndoe6345789/pyracms-runner-$$l; done
      RUNNER_IMAGE_PREFIX: ghcr.io/johndoe6345789/pyracms-runner-
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-pyracms}
      DB_USER: ${POSTGRES_USER:-pyracms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pyracms}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      # DEV DEFAULT ONLY. docker-compose.prod.yml makes JWT_SECRET mandatory.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-do-not-use-in-prod}
      # Demo content + admin/password123 (seed.sh): OFF by default here.
      # Set SEED_DEV=1 for a throwaway demo instance only.
      SEED_DEV: ${SEED_DEV:-0}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SEARCH_ENGINE: elasticsearch
      # Uploaded-file storage: s3 (default, the bundled object store or your
      # own endpoint). STORAGE_BACKEND=local writes to the uploads_data
      # volume and is for throwaway development only (docs/STORAGE.md).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      # Big uploads (chunked, docs/STORAGE.md): whole-file cap in MB.
      MAX_CHUNKED_UPLOAD_MB: ${MAX_CHUNKED_UPLOAD_MB:-1024}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:9000}
      S3_BUCKET: ${S3_BUCKET:-pyracms}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pyracms-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pyracms-dev-secret}
      # OAuth (uncomment and fill in for OAuth support; prefer an env file)
      # OAUTH_GITHUB_CLIENT_ID: ""
      # OAUTH_GITHUB_CLIENT_SECRET: ""
      # OAUTH_GOOGLE_CLIENT_ID: ""
      # OAUTH_GOOGLE_CLIENT_SECRET: ""
      # OAUTH_DISCORD_CLIENT_ID: ""
      # OAUTH_DISCORD_CLIENT_SECRET: ""
    # DEV: the code runner starts sibling sandbox containers on the host
    # daemon, which needs the host's docker.sock and therefore root inside this
    # container. Mounting the socket is equivalent to root on the host: only do
    # this on a trusted dev machine. Production uses a filtered socket proxy
    # and an unprivileged user instead (docker-compose.prod.yml).
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/johndoe6345789/pyracms-frontend:${PYRACMS_VERSION:-latest}
    environment:
      API_URL: http://backend:8080
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback by default. To expose on a LAN set NGINX_BIND=0.0.0.0, and put
      # TLS in front of it (see ../SECURITY.md).
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-3199}:80"
    volumes:
      # Defaults to the repo-relative file for local development. The
      # remote deploy (DeployButton, which calls compose from inside the
      # backend container via the shared docker.sock) must set NGINX_CONF
      # to the absolute *host* path, because the docker daemon resolves
      # bind-mounts on the host, not in the calling container.
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend

  # ---- S3-compatible object store for uploaded files (the default) --------
  # https://github.com/johndoe6345789/object-store  (docs/STORAGE.md)
  #   docker compose up -d      # starts the store with everything else
  # Its own database (`objectstore`) lives in the postgres service above.
  objectstore-db:
    image: postgres:15-alpine@sha256:a46e076249ce434e41203b8c1dadfaa025b9726331d72390df038385d6dc29cd
    restart: "no"
    entrypoint: ["sh", "/objectstore-init.sh", "db"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pyracms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pyracms}
      OBJECTSTORE_DB: ${OBJECTSTORE_DB:-objectstore}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./scripts/objectstore-init.sh:/objectstore-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  objectstore:
    image: ghcr.io/johndoe6345789/object-store:latest@sha256:0bc19d893dcc14e2a9504091147e4b2d3a3fe2c8efa340b9a3cd7a7e07809a1e
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-pyracms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pyracms}
      PGDATABASE: ${OBJECTSTORE_DB:-objectstore}
      # The server itself reads a libpq string (the PG* vars serve the migrations).
      S3_DB_CONN: host=postgres port=5432 dbname=${OBJECTSTORE_DB:-objectstore} user=${POSTGRES_USER:-pyracms} password=${POSTGRES_PASSWORD:-pyracms}
      S3_PORT: 9000
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only (the backend reaches it as http://objectstore:9000).
      - "127.0.0.1:${OBJECTSTORE_PORT:-9099}:9000"
    volumes:
      - objectstore_data:/data/s3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      objectstore-db:
        condition: service_completed_successfully

  # Creates PyraCMS's API key (S3_ACCESS_KEY / S3_SECRET_KEY). Dev falls back
  # to throwaway keys; production must set real ones (scripts/gen-env.sh).
  objectstore-init:
    image: postgres:15-alpine@sha256:a46e076249ce434e41203b8c1dadfaa025b9726331d72390df038385d6dc29cd
    restart: "no"
    entrypoint: ["sh", "/objectstore-init.sh", "key"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pyracms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pyracms}
      OBJECTSTORE_DB: ${OBJECTSTORE_DB:-objectstore}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pyracms-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pyracms-dev-secret}
      OBJECTSTORE_REMOVE_SEED: ${OBJECTSTORE_REMOVE_SEED:-0}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./scripts/objectstore-init.sh:/objectstore-init.sh:ro
    depends_on:
      objectstore:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  es_data:
  uploads_data:
  objectstore_data:
