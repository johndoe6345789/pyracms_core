# NOTE: docker-compose.ghcr.yml runs the prebuilt GHCR images (no build).
# Usage: PYRACMS_VERSION=1.2.3 docker compose -f docker-compose.ghcr.yml up -d
# (defaults to :latest). Still development-grade credentials: change them.
# For production:
# - Use Docker secrets or external environment files for credentials
# - Never commit production credentials to version control
# - Use strong, randomly generated passwords

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pyracms
      POSTGRES_PASSWORD: pyracms
      POSTGRES_DB: pyracms
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyracms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - network.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9299:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/johndoe6345789/pyracms-backend:${PYRACMS_VERSION:-latest}
    ports:
      - "8099:8080"
    volumes:
      # Code runner starts sandbox containers on the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Pre-pull once: for l in python node go cpp rust java ruby; do
      #   docker pull ghcr.io/johndoe6345789/pyracms-runner-$$l; done
      RUNNER_IMAGE_PREFIX: ghcr.io/johndoe6345789/pyracms-runner-
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pyracms
      DB_USER: pyracms
      DB_PASSWORD: pyracms
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      JWT_SECRET: change-me-in-production
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SEARCH_ENGINE: elasticsearch
      # OAuth (uncomment and fill in for OAuth support)
      # OAUTH_GITHUB_CLIENT_ID: ""
      # OAUTH_GITHUB_CLIENT_SECRET: ""
      # OAUTH_GOOGLE_CLIENT_ID: ""
      # OAUTH_GOOGLE_CLIENT_SECRET: ""
      # OAUTH_DISCORD_CLIENT_ID: ""
      # OAUTH_DISCORD_CLIENT_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    image: ghcr.io/johndoe6345789/pyracms-frontend:${PYRACMS_VERSION:-latest}
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "3199:80"
    volumes:
      # Defaults to the repo-relative file for local development. The
      # remote deploy (DeployButton, which calls compose from inside the
      # backend container via the shared docker.sock) must set NGINX_CONF
      # to the absolute *host* path, because the docker daemon resolves
      # bind-mounts on the host, not in the calling container.
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  es_data:
