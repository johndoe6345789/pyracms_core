# PyraCMS production hardening override.
#
# Layer on top of EITHER base file (needs Docker Compose >= 2.24 for !reset /
# !override):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod -p pyracms-prod up -d --build
#   docker compose -f docker-compose.ghcr.yml -f docker-compose.prod.yml \
#     --env-file .env.prod -p pyracms-prod up -d
#
# What it changes versus dev:
#   * no default credentials: compose refuses to start if a secret is unset
#   * no database/cache/search/backend ports on the host; only nginx is
#     published (loopback by default; put TLS in front of it)
#   * data tier lives on an `internal` network with no route out
#   * backend is unprivileged (uid 10001) and talks to a *filtered* docker
#     socket proxy instead of mounting /var/run/docker.sock
#   * read-only root filesystems, all capabilities dropped, no-new-privileges,
#     memory/cpu/pids limits, log rotation, restart policy
#   * demo seeding (admin/password123) disabled
#
# Use a fresh project name/volumes (-p pyracms-prod): an existing dev volume
# was initialised with the dev password and will not accept the new one.
#
# RESIDUAL RISK, code runner: the proxy limits the Docker API surface (no
# exec, volumes, networks, build, swarm, secrets, info...) but it cannot
# inspect request bodies, so a compromised backend can still ask the daemon
# for a privileged container. If you do not need "run snippet", drop the
# docker-proxy service and the DOCKER_HOST variable. Otherwise run the runner
# daemon on a separate/disposable host (DOCKER_HOST=ssh:// or tcp+TLS), use
# rootless Docker, Sysbox or gVisor, or add an authorization plugin.
# See SECURITY_AUDIT_INFRA.md.

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

networks:
  edge: {}
  data:
    internal: true          # postgres/redis/elasticsearch: no egress, no ingress
  runner-ctl:
    internal: true          # backend <-> docker-proxy only

services:
  postgres:
    <<: *hardened
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyracms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-pyracms}
    ports: !reset []
    networks: [data]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # entrypoint drops to `postgres`
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    mem_limit: 1g
    cpus: 2
    pids_limit: 300

  redis:
    <<: *hardened
    ports: !reset []
    networks: [data]
    cap_add: [SETGID, SETUID, CHOWN]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    cpus: 1
    pids_limit: 100

  elasticsearch:
    <<: *hardened
    ports: !reset []
    networks: [data]
    # Security stays off because the backend has no ES credential support;
    # isolation is the network (internal, no published port).
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512

  docker-proxy:
    <<: *hardened
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    environment:
      # Only what `docker run --rm` needs. Everything else stays denied.
      CONTAINERS: 1     # create/start/attach/wait/rm/logs
      POST: 1           # allow non-GET verbs (create, start, delete) on the above
      IMAGES: 1         # image inspect (and pull if a runner image is missing)
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      DISTRIBUTION: 0
      AUTH: 0
      INFO: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [runner-ctl]
    # Not read_only: the image entrypoint renders haproxy.cfg into its own
    # config dir at start. It runs no user code and has no published port.
    mem_limit: 64m
    pids_limit: 50
    # No `ports:`: reachable only from the backend over the internal network.

  backend:
    <<: *hardened
    user: "10001:10001"
    ports: !reset []
    networks: [edge, data, runner-ctl]   # edge: outbound OAuth/SMTP/webhooks
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod (openssl rand -hex 48)}
      SEED_DEV: "0"
      PYRACMS_ENV: production
      # Production stores files in S3 only: the backend refuses to start
      # with anything else, or without both keys.
      STORAGE_BACKEND: s3
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env.prod}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}
      DOCKER_HOST: tcp://docker-proxy:2375
      # Public origin: e-mail links, CORS allow-list, sitemap (no trailing /).
      PUBLIC_BASE_URL: ${SITE_URL:-http://localhost:3199}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${SITE_URL:-http://localhost:3199}}
      # SMTP: the server treats an *empty* SMTP_PORT as an error, so give
      # every value a safe default. Unset SMTP_HOST = mail is not delivered.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pyracms.com}
      # First-run bootstrap (see docs/DEPLOY.md): creates the Platform Owner
      # only while NO platform account exists. Remove after the first start.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # OAuth stays OFF unless this optional file exists: the server enables a
    # provider whenever the variables are merely *set*, even when empty.
    # Put OAUTH_<GITHUB|GOOGLE|DISCORD>_CLIENT_ID/_SECRET/_REDIRECT_URI in it.
    env_file:
      - path: ${OAUTH_ENV_FILE:-.env.oauth}
        required: false
    volumes: !override
      - uploads_data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      docker-proxy:
        condition: service_started
    mem_limit: 1g
    cpus: 2
    pids_limit: 512

  frontend:
    <<: *hardened
    networks: [edge]
    environment:
      API_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    mem_limit: 512m
    cpus: 1
    pids_limit: 200

  nginx:
    <<: *hardened
    networks: [edge]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    # nginx is published on loopback by default; a TLS reverse proxy
    # (CapRover, Traefik, Caddy, Cloudflare tunnel...) should sit in front.
    ports: !override
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-3199}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    cpus: 1
    pids_limit: 100

  # Object store for uploaded files (see docs/STORAGE.md). Data network only: nothing is published to the host.
  # Set S3_ACCESS_KEY / S3_SECRET_KEY (gen-env.sh does) and
  # OBJECTSTORE_REMOVE_SEED=1 so the store's built-in minioadmin key is gone.
  objectstore-db:
    <<: *hardened
    restart: "no"
    networks: [data]
    read_only: true
    mem_limit: 128m
    pids_limit: 50

  objectstore:
    <<: *hardened
    ports: !reset []
    networks: [data]
    # Not read_only: the server writes its log files to its working dir (/).
    mem_limit: 512m
    cpus: 1
    pids_limit: 200

  objectstore-init:
    <<: *hardened
    restart: "no"
    networks: [data]
    read_only: true
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      OBJECTSTORE_REMOVE_SEED: "1"
    mem_limit: 128m
    pids_limit: 50

  # Optional scheduled backups: `--profile backup up -d` (docs/OPERATIONS.md).
  # Runs scripts/backup-inner.sh every BACKUP_INTERVAL_H hours (default 24).
  backup:
    <<: *hardened
    profiles: [backup]
    image: postgres:15-alpine@sha256:a46e076249ce434e41203b8c1dadfaa025b9726331d72390df038385d6dc29cd
    user: "0:0"
    cap_add: [DAC_OVERRIDE]     # read uploads owned by uid 10001
    networks: [data]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pyracms}
      PGDATABASE: ${POSTGRES_DB:-pyracms}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      BACKUP_INTERVAL_H: ${BACKUP_INTERVAL_H:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    entrypoint: ["sh", "/backup-inner.sh"]
    command: ["loop"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/backup-inner.sh:/backup-inner.sh:ro
      - uploads_data:/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    mem_limit: 256m
    pids_limit: 50
