# PyraCMS edge proxy (mounted as /etc/nginx/conf.d/default.conf).
#
# This file is HTTP-only on purpose: TLS is normally terminated in front of
# it (CapRover / Traefik / Caddy / a Proxmox reverse-proxy LXC / Cloudflare).
# For a stand-alone TLS setup see nginx.tls.conf.example.
#
# Behind another proxy, tell nginx which hops to trust so rate limiting and
# logs see the real client address (uncomment and adjust the CIDR):
#   set_real_ip_from 10.0.0.0/8;
#   set_real_ip_from 172.16.0.0/12;
#   real_ip_header   X-Forwarded-For;   # Cloudflare: CF-Connecting-IP
#   real_ip_recursive on;
# ...and, if that proxy terminates TLS, forward its scheme (HSTS, OAuth
# redirects and Next.js origin detection need "https"): replace every
# `proxy_set_header X-Forwarded-Proto $scheme;` below with
#   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# ONLY when nginx is reachable exclusively through that trusted proxy.
# Full walkthrough: docs/DEPLOY.md ("Behind a reverse proxy").

# -- rate limiting (per client IP) --------------------------------------
# Credential-guessing surface only: /api/auth/me (session poll) is not limited
# here because an empty key is exempt from limit_req.
map $uri $pyracms_auth_key {
    ~^/api/auth/(login|register|forgot-password|reset-password|verify-email)/?$ $binary_remote_addr;
    default "";
}
limit_req_zone  $pyracms_auth_key zone=pyracms_auth:10m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=pyracms_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=pyracms_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# WebSocket upgrade only when the client asked for it.
map $http_upgrade $pyracms_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    # -- request limits / slow-client protection ------------------------
    client_max_body_size    1m;      # uploads are allowed 50m under /api/ only
    client_body_timeout     30s;
    client_header_timeout   15s;
    send_timeout            30s;
    keepalive_timeout       30s;
    large_client_header_buffers 4 8k;
    limit_conn pyracms_conn 50;

    # -- security headers (the frontend adds CSP/HSTS for HTML pages) ----
    # Hide what upstreams already set so each header is sent exactly once.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Liveness: answered by nginx itself (no upstream, no rate limit).
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok";
    }

    # Readiness: 200 only while the backend + database answer (the backend
    # has no dedicated /api/health yet; /api/tenants runs a DB query).
    location = /readyz {
        access_log off;
        proxy_pass http://backend:8080/api/tenants;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # Never serve dotfiles (.git, .env, ...) even if something proxies them.
    location ~ /\. {
        return 404;
    }

    # Common proxy settings. X-Forwarded-For is *overwritten* with the
    # address nginx sees (client-supplied values are not trusted).
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Credential endpoints: strict per-IP limit (login, register, reset...).
    location /api/auth/ {
        limit_req zone=pyracms_auth burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Real-time channels (collab editing, notifications).
    location /api/ws/ {
        limit_req zone=pyracms_api burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $pyracms_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Chunked uploads (PUT parts of up to 50 MiB): each request stays under
    # a CDN's 100 MB cap; streamed to the backend, not spooled to disk.
    location /api/files/uploads/ {
        limit_req zone=pyracms_api burst=60 nodelay;
        client_max_body_size 64m;
        client_body_timeout  300s;
        proxy_request_buffering off;
        proxy_pass http://backend:8080;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        limit_req zone=pyracms_api burst=60 nodelay;
        client_max_body_size 50m;
        client_body_timeout  120s;
        proxy_pass http://backend:8080;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        limit_req zone=pyracms_api burst=100 nodelay;
        proxy_pass http://frontend:3000;
        # A location that sets any proxy_set_header drops the inherited
        # ones, so repeat them: Next.js derives the public origin
        # (sitemap, robots, Open Graph) from these.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $pyracms_connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
